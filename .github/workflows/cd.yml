name: CD

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cd.yml
      - Justfile
      - global.json
      - package.json
      - scripts/generate-release-notes.mts
      - src/**

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    env:
      CONFIGURATION: Release
      SOLUTION: ./src/AspireC4.slnx
      PACKAGE_PROJECT: ./src/src/AspireC4/AspireC4.csproj
      ARTIFACTS_DIR: ./artifacts/nuget

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release-trigger
        name: Prevent duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Releases must only be created from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            echo "Tag ${tag} already exists — package build and release skipped."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          elif gh release view "${tag}" > /dev/null 2>&1; then
            echo "GitHub release ${tag} already exists — package build and release skipped."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Version ${version} is available — proceeding with package build."
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

      - id: version
        name: Read manually maintained release version
        if: ${{ steps.release-trigger.outputs.should_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"

          if ! node -e "process.exit(/^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$/.test(process.argv[1]) ? 0 : 1)" "${version}"; then
            echo "::error::package.json contains an invalid semantic version: ${version}"
            exit 1
          fi

          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Block duplicate version
        if: ${{ steps.release-trigger.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${RELEASE_TAG} already exists on origin. Refusing to replace an existing release version."
            exit 1
          fi

          release_status="$(
            curl -sS \
              -o release.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          )"

          if [[ "${release_status}" == "200" ]]; then
            echo "::error::Release ${RELEASE_TAG} already exists. Refusing to replace an existing release version."
            cat release.json
            exit 1
          fi

          if [[ "${release_status}" != "404" ]]; then
            echo "::error::Unexpected GitHub API response while checking ${RELEASE_TAG} (HTTP ${release_status})."
            cat release.json
            exit 1
          fi

          rm -f release.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      # - name: CSharpier format check
      #   run: |
      #     dotnet tool install --global csharpier --version 1.2.6
      #     csharpier check ./

      - name: Restore solution
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration ${{ env.CONFIGURATION }}

      - name: Run unit tests
        run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --treenode-filter "/*/*/*/*[Category=Unit]" --no-build

      # - name: Run integration tests
      #   run: dotnet test --project src/tests/AspireC4.IntegrationTests --no-build --verbosity normal --configuration ${{ env.CONFIGURATION }}

      - name: Pack NuGet artifacts
        if: ${{ steps.release-trigger.outputs.should_release == 'true' }}
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${ARTIFACTS_DIR}"

          dotnet pack "${PACKAGE_PROJECT}" \
            --configuration "${CONFIGURATION}" \
            --output "${ARTIFACTS_DIR}" \
            "/p:Version=${PACKAGE_VERSION}" \
            "/p:RepositoryBranch=${GITHUB_REF_NAME}" \
            "/p:RepositoryCommit=${GITHUB_SHA}" \
            "/p:COPYRIGHT_YEAR=$(date -u +%Y)"

      - id: changelog
        name: Build changelog from noteworthy commits
        if: ${{ steps.release-trigger.outputs.should_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          if [[ -n "${previous_tag}" ]]; then
            commit_range="${previous_tag}..HEAD"
          else
            commit_range="HEAD"
          fi

          node scripts/generate-release-notes.mts "${commit_range}" > release-notes.md
          cat release-notes.md

      - name: Publish downloadable package assets to GitHub Releases
        if: ${{ steps.release-trigger.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_MAKE_LATEST: ${{ steps.version.outputs.prerelease == 'false' && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          prerelease_flag=""
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi

          # Create as a draft so assets can be uploaded before the release is published.
          # Register cleanup so a transient failure at publish does not leave an orphaned
          # draft+tag that would block duplicate-version checks on retry.
          cleanup() {
            echo "::warning::Release step failed — cleaning up draft release and tag to allow a clean retry."
            gh release delete "${RELEASE_TAG}" --yes --cleanup-tag 2>/dev/null || true
          }
          trap cleanup ERR

          gh release create "${RELEASE_TAG}" \
            --draft \
            --title "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            ${prerelease_flag} \
            --notes-file release-notes.md \
            ./artifacts/nuget/*.nupkg \
            ./artifacts/nuget/*.snupkg

          # Publish the draft — assets are already attached, so immutable-release upload errors cannot occur.
          # --latest is deferred to here: GitHub rejects that flag on draft releases.
          latest_flag=""
          if [[ "${RELEASE_MAKE_LATEST}" == "true" ]]; then
            latest_flag="--latest"
          fi

          gh release edit "${RELEASE_TAG}" --draft=false ${latest_flag}

          trap - ERR

          {
            echo "### Package ready for manual publishing"
            echo
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo
            echo 'Download the `.nupkg` from the release and publish it to your chosen NuGet feed manually.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Skip release publish
        if: ${{ steps.release-trigger.outputs.should_release != 'true' }}
        run: echo "The current package.json version already has a tag or GitHub release — publishing was skipped."
